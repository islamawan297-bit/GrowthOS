<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GrowthOS AI — Contact</title>
  <meta name="description" content="GrowthOS AI contact form." />
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">GrowthOS AI</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="features.html">Features</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="success.html">Success</a>
        <a href="pricing.html">Pricing</a>
        <a href="comparison.html">Compare</a>
        <a href="faq.html">FAQ</a>
        <a class="cta" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="contact container">
      <h2 class="section-title">Contact & Demo</h2>
      <div class="contact-grid">
        <form id="contactForm" class="glass card contact-form">
          <label>Name<input type="text" name="name" required></label>
          <label>Email<input type="email" name="email" required></label>
          <label>Company<input type="text" name="company"></label>
          <label>Message<textarea name="message" rows="4"></textarea></label>
          <button class="btn primary" type="submit">Request Demo</button>
        </form>
        <div class="contact-info glass card">
          <h4>Get in touch</h4>
          <p>Email: hello@growthos.ai</p>
          <p>Estimated response &lt;24 hours</p>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="container">
      <div class="foot-grid">
        <div>© <span id="year"></span> GrowthOS AI</div>
        <div class="foot-links">Privacy • Terms • Status</div>
      </div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
